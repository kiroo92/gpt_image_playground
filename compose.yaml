name: gpt-image-playground

services:
  gpt-image:
    image: gpt-image-playground:local
    build:
      context: .
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8081}:80"
    environment:
      HOST: "0.0.0.0"
      PORT: "80"
      SUB2API_URL: "https://www.open1.codes/"
      SUB2API_PROXY_ENABLED: "${SUB2API_PROXY_ENABLED:-true}"
      # Key 在网页中填写，携带网站认证时自动获取。
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
